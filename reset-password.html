<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Forte Community Clinic</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <main class="shell-narrow">
    <div class="breadcrumb">ACCOUNT RECOVERY</div>
    <h2 class="page-title">Choose a new password</h2>
    <p class="page-desc">Use a password between 8 and 72 bytes long.</p>
    <div id="reset-banner" class="banner" role="status" aria-live="polite"></div>
    <form id="reset-form" novalidate>
      <label for="new-password">New password <span class="req">*</span></label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <label for="confirm-password">Confirm new password <span class="req">*</span></label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <div class="btn-row">
        <button class="btn btn-primary" id="reset-submit" type="submit">Reset password</button>
        <a class="btn btn-ghost" href="login.html">Back to sign in</a>
      </div>
    </form>
  </main>
  <script src="js/app.js"></script>
  <script>
    renderChrome();
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('reset-form');
    const button = document.getElementById('reset-submit');
    const bannerId = 'reset-banner';

    if (!/^[a-f0-9]{64}$/i.test(token)) {
      form.hidden = true;
      showBanner(bannerId, 'This password reset link is invalid or has expired. Request a new link from the sign-in page.', 'error');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('confirm-password').value;
      if (password.length < 8 || new TextEncoder().encode(password).length > 72) {
        showBanner(bannerId, 'Use a password between 8 and 72 bytes long.', 'error');
        return;
      }
      if (password !== confirmation) {
        showBanner(bannerId, 'The passwords do not match.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Resetting…';
      try {
        const result = await DB.resetPassword(token, password);
        showBanner(bannerId, result.message, 'success');
        form.hidden = true;
      } catch (error) {
        showBanner(bannerId, apiErrorMessage(error), 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
