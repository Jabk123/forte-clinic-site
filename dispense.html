<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispense Medication — Forte Community Clinic</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="dash-layout">
    <nav class="tabs-nav" id="dash-nav"></nav>
    <main class="dash-main dispense-main">
      <div class="breadcrumb">PHARMACY · DISPENSING</div>
      <h2 class="page-title">Dispense medication</h2>
      <p class="page-desc">Review prescribed medication, verify the patient and quantity, then dispense to update stock.</p>
      <div id="form-banner" class="banner" role="status"></div>
      <section class="card dispense-search" aria-label="Search prescriptions">
        <label for="search">Search by patient, medication, or contact</label>
        <input type="search" id="search" placeholder="Start typing to filter prescriptions…" autocomplete="off">
      </section>
      <section class="card">
        <div class="card-head"><h3>Pending prescriptions</h3></div>
        <div id="list" class="prescription-list" aria-live="polite">Loading prescriptions…</div>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script>
    window.PAGE_HELP = [
      'Search by patient name, medication name, or contact number.',
      'Dispensing deducts the prescribed quantity from inventory.',
      'If stock is insufficient, the prescription stays pending.'
    ];
    const session = Session.requireLogin(['Pharmacist', 'Admin']);
    if (!session) throw new Error('redirect');
    renderChrome('dispense.html');

    let prescriptions = [];
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }
    function renderPrescriptions(filter = '') {
      const query = filter.trim().toLowerCase();
      const rows = prescriptions.filter(prescription => {
        const searchable = [
          prescription.PatientFirstName,
          prescription.PatientLastName,
          prescription.ContactNumber,
          prescription.MedicationName,
          prescription.Concentration
        ].join(' ').toLowerCase();
        return searchable.includes(query);
      });
      const list = document.getElementById('list');
      if (!rows.length) {
        list.innerHTML = emptyState(query
          ? 'No prescriptions match your search.'
          : 'No pending prescriptions to dispense.');
        return;
      }
      list.innerHTML = rows.map(prescription => {
        const patient = [prescription.PatientFirstName, prescription.PatientLastName]
          .filter(Boolean).join(' ');
        const medication = [prescription.MedicationName, prescription.Concentration]
          .filter(Boolean).join(' ');
        return `<article class="prescription-card">
          <div class="prescription-card__heading">
            <div>
              <p class="prescription-card__reference">Prescription #${escapeHtml(prescription.Prescription_ID)}</p>
              <h4>${escapeHtml(medication) || 'Medication unavailable'}</h4>
            </div>
            <span class="badge badge-teal">${escapeHtml(prescription.Quantity)} unit(s)</span>
          </div>
          <dl class="prescription-details">
            <div><dt>Patient</dt><dd>${escapeHtml(patient) || '—'}</dd></div>
            <div><dt>Contact</dt><dd>${escapeHtml(prescription.ContactNumber) || '—'}</dd></div>
            <div><dt>Prescribed</dt><dd>${formatDate(prescription.PrescribedDate)}</dd></div>
            <div><dt>Available stock</dt><dd>${escapeHtml(prescription.StockQuantity)}</dd></div>
            <div class="prescription-details__instructions"><dt>Instructions</dt><dd>${escapeHtml(prescription.DosageInstructions) || 'No instructions recorded'}</dd></div>
          </dl>
          <button type="button" class="btn btn-primary dispense-btn" data-id="${Number(prescription.Prescription_ID)}">Dispense medication</button>
        </article>`;
      }).join('');
      list.querySelectorAll('.dispense-btn').forEach(button => {
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            await DB.dispense(Number(button.dataset.id));
          } catch (err) {
            button.disabled = false;
            toast(apiErrorMessage(err), 'error');
            return;
          }
          toast('Prescription dispensed and inventory updated.', 'success');
          document.getElementById('search').value = '';
          await loadPrescriptions();
        });
      });
    }
    async function loadPrescriptions() {
      const list = document.getElementById('list');
      list.innerHTML = '<p>Loading prescriptions…</p>';
      try {
        prescriptions = await DB.getPrescriptions();
        renderPrescriptions(document.getElementById('search').value);
      } catch (err) {
        list.innerHTML = emptyState(escapeHtml(apiErrorMessage(err)));
      }
    }
    document.getElementById('search').addEventListener('input', event => {
      renderPrescriptions(event.target.value);
    });
    loadPrescriptions();
  </script>
</body>
</html>
