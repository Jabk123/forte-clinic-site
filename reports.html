<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Reports — Forte Community Clinic</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="dash-layout">
    <nav class="tabs-nav" id="dash-nav"></nav>
    <main class="dash-main">
      <div class="breadcrumb">REPORTS</div>
      <h2 class="page-title">Generate Reports</h2>
      <p class="page-desc">Manager selects report type, filters details, and can print/export the report.</p>
      <div class="card">
        <div class="card-head"><h3>Report form</h3></div>
        <label for="rtype">Report type</label>
        <select id="rtype">
          <option value="appointments">Appointments by status</option>
          <option value="payments">Payments summary</option>
          <option value="consultations">Consultations</option>
          <option value="inventory">Inventory levels</option>
        </select>
        <label for="from">From date (optional)</label>
        <input type="date" id="from">
        <label for="to">To date (optional)</label>
        <input type="date" id="to">
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="run">Retrieve report</button>
          <button type="button" class="btn btn-ghost" id="print">Print report</button>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Report details</h3></div>
        <div id="out" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script>
    window.PAGE_HELP = ['Select a report type and optional date range.'];
    const s = Session.requireLogin(['Manager', 'Admin']);
    if (!s) throw new Error('redirect');
    renderChrome('reports.html');
    function dateKey(value) {
      return value ? String(value).slice(0, 10) : '';
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }
    function filterByDate(rows, field, from, to) {
      return rows.filter(row => {
        const date = dateKey(row[field]);
        return date && (!from || date >= from) && (!to || date <= to);
      });
    }
    async function runReport() {
      const type = document.getElementById('rtype').value;
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const el = document.getElementById('out');
      if (from && to && from > to) {
        el.innerHTML = emptyState('The start date must be on or before the end date.');
        return;
      }
      el.innerHTML = '<p>Loading report…</p>';
      try {
        if (type === 'appointments') {
          const data = await DB.getAppointments();
          const rows = filterByDate(data, 'AppointmentDate', from, to);
          const statuses = {};
          rows.forEach(a => {
            const status = a.AppointmentStatus || a.Status || 'Unknown';
            statuses[status] = (statuses[status] || 0) + 1;
          });
          el.innerHTML = rows.length
            ? `<p><strong>Total appointments:</strong> ${rows.length}</p>
               <div class="table-wrap"><table><thead><tr><th>Status</th><th>Count</th></tr></thead>
               <tbody>${Object.entries(statuses).map(([status, count]) => `<tr><td>${statusBadge(escapeHtml(status))}</td><td class="mono">${count}</td></tr>`).join('')}</tbody></table></div>`
            : emptyState('No appointments for the selected date range.');
        } else if (type === 'payments') {
          const data = await DB.getPayments();
          const rows = filterByDate(data, 'PaymentDate', from, to);
          const total = rows.filter(p => String(p.IsPaid).toLowerCase() === 'yes').reduce((sum, p) => sum + Number(p.PaymentAmount || 0), 0);
          el.innerHTML = rows.length
            ? `<p><strong>Collected:</strong> ${formatCurrency(total)} · <strong>Records:</strong> ${rows.length}</p>
               <div class="table-wrap"><table><thead><tr><th>Date</th><th>Service</th><th>Amount</th><th>Status</th></tr></thead>
               <tbody>${rows.map(p => `<tr><td>${formatDate(dateKey(p.PaymentDate))}</td><td>${escapeHtml(p.ServiceName)}</td><td class="mono">${formatCurrency(p.PaymentAmount)}</td><td>${statusBadge(escapeHtml(p.IsPaid))}</td></tr>`).join('')}</tbody></table></div>`
            : emptyState('No payments for the selected date range.');
        } else if (type === 'consultations') {
          const data = await DB.getConsultations();
          const rows = filterByDate(data, 'ConsultationDate', from, to);
          el.innerHTML = rows.length
            ? `<p><strong>Total consultations:</strong> ${rows.length}</p>
               <div class="table-wrap"><table><thead><tr><th>Date</th><th>Patient</th><th>Diagnosis</th><th>Notes</th></tr></thead>
               <tbody>${rows.map(c => `<tr><td>${formatDate(dateKey(c.ConsultationDate))}</td><td>${escapeHtml([c.PatientFirstName, c.PatientLastName].filter(Boolean).join(' ')) || '—'}</td><td>${escapeHtml(c.DiagnosisSummary) || '—'}</td><td>${escapeHtml(c.Notes) || '—'}</td></tr>`).join('')}</tbody></table></div>`
            : emptyState('No consultations for the selected date range.');
        } else {
          const rows = await DB.getInventory();
          el.innerHTML = rows.length
            ? `<div class="table-wrap"><table><thead><tr><th>Medication</th><th>Stock</th><th>Reorder</th><th>Expiry</th></tr></thead>
               <tbody>${rows.map(i => `<tr><td>${escapeHtml([i.MedicationName, i.Concentration].filter(Boolean).join(' '))}</td><td class="mono">${escapeHtml(i.StockQuantity)}</td><td class="mono">${escapeHtml(i.ReorderLevel)}</td><td>${formatDate(i.ExpiryDate)}</td></tr>`).join('')}</tbody></table></div>`
            : emptyState('No inventory records found.');
        }
      } catch (err) {
        el.innerHTML = emptyState(escapeHtml(apiErrorMessage(err)));
      }
    }
    document.getElementById('run').addEventListener('click', runReport);
    document.getElementById('print').addEventListener('click', () => window.print());
    runReport();
  </script>
</body>
</html>
