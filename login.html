<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Forte Community Clinic</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="shell-narrow">
    <div class="breadcrumb">SIGN IN</div>
    <h2 class="page-title">Sign in</h2>
    <p class="page-desc">Enter your email and password. You will be directed to the screens for your role.</p>
    <div id="form-banner" class="banner"></div>
    <form id="login-form" novalidate>
      <label for="email">Email address <span class="req">*</span></label>
      <input type="email" id="email" autocomplete="username" placeholder="you@example.com" required>
      <div class="field-error" id="err-email"></div>
      <label for="password">Password <span class="req">*</span></label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      <div class="field-error" id="err-password"></div>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:18px;">
        <input type="checkbox" id="remember" style="width:auto;"> Keep me signed in on this device
      </label>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
        <a class="btn btn-ghost" href="register.html">Register as patient</a>
      </div>
      <p style="margin-top:16px;font-size:1rem;"><a class="linklike" href="#" id="forgot-link">Forgot password?</a></p>
    </form>
  </div>
  <script src="js/app.js"></script>
  <script>
    window.PAGE_HELP = [
      'Enter the email and password associated with your clinic account.',
      'If you are a patient and do not have an account yet, use Register as patient.'
    ];
    renderChrome();
    const existing = Session.get();
    if (existing) window.location.href = ROLE_HOME[existing.Role] || 'index.html';

    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const checkEmail = bindField(email, document.getElementById('err-email'), v => Validate.notEmpty(v) && Validate.email(v), 'Enter a valid email address.');
    const checkPassword = bindField(password, document.getElementById('err-password'), v => Validate.notEmpty(v), 'Password is required.');

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!checkEmail() || !checkPassword()) {
        showBanner('form-banner', 'Please fix the highlighted fields.', 'error');
        return;
      }
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const result = await DB.login(email.value.trim().toLowerCase(), password.value);
        // Expected response shape: { user, userType, token }
        const user = result.user || result;
        const userType = result.userType || (user.Patient_ID ? 'Patient' : 'Employee');
        if (result.token) user.Token = result.token;
        Session.set(user, userType, document.getElementById('remember').checked);
        toast('Welcome back, ' + user.FirstName + '.', 'success');
        const role = userType === 'Patient' ? 'Patient' : user.EmployeeType;
        setTimeout(() => { window.location.href = ROLE_HOME[role] || 'index.html'; }, 350);
      } catch (err) {
        showBanner('form-banner', apiErrorMessage(err), 'error');
        password.classList.add('invalid');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    document.getElementById('forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      toast('Password reset will be available once the email service is configured on the server.', '');
    });
  </script>
</body>
</html>
